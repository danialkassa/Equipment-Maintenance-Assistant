          \    if not real_sources:\n        if any(s and not is_placeholder(s, allow_tail=False)\
          \ for s in sources):\n            return {\"valid\": \"false\", \"answer_md\"\
          : \"\", \"error\": \"source_documents_not_documents\"}\n        return {\"\

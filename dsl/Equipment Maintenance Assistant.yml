    - data:
        code: "def main(llm_output):\n    import json\n    if not llm_output:\n  \
          \      return {\"valid\": \"false\", \"answer_md\": \"\", \"error\": \"\
          empty_output\"}\n    try:\n        data = json.loads(llm_output) if isinstance(llm_output,\
          \ str) else llm_output\n    except Exception:\n        return {\"valid\"\
          : \"false\", \"answer_md\": \"\", \"error\": \"parse_failed\"}\n\n    if\
          \ not isinstance(data, dict):\n        return {\"valid\": \"false\", \"\
          answer_md\": \"\", \"error\": \"not_an_object\"}\n\n    required = [\"possible_causes\"\
          , \"diagnostic_steps\", \"repair_procedure\", \"source_documents\"]\n  \
          \  missing = [k for k in required if not data.get(k)]\n    if missing:\n\
          \        return {\"valid\": \"false\", \"answer_md\": \"\", \"error\": \"\
          missing: \" + \",\".join(missing)}\n\n    md = \"## 可能原因\\n\" + \"\\n\"\
          .join(f\"- {x}\" for x in data[\"possible_causes\"])\n    md += \"\\n\\\
          n## 诊断步骤\\n\" + \"\\n\".join(f\"{i}. {x}\" for i, x in enumerate(data[\"\
          diagnostic_steps\"], 1))\n    md += \"\\n\\n## 维修流程\\n\" + \"\\n\".join(f\"\
          {i}. {x}\" for i, x in enumerate(data[\"repair_procedure\"], 1))\n    sw\
          \ = data.get(\"safety_warnings\") or [\"无\"]\n    md += \"\\n\\n## 安全警告\\\
          n\" + \"\\n\".join(f\"- {x}\" for x in sw)\n    md += \"\\n\\n## 参考文档\\\
          n\" + \"\\n\".join(f\"- {x}\" for x in data[\"source_documents\"])\n   \
          \ return {\"valid\": \"true\", \"answer_md\": md, \"error\": \"\"}\n"
        code_language: python3

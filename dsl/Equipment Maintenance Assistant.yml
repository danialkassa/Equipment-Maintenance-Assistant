    - data:
        code: "def main(llm_output) -> dict:\n    \"\"\"Validate the LLM's structured\
          \ diagnosis and render it as markdown.\n\n    Returns valid=\"false\" with\
          \ a short error string whenever the payload is not\n    a usable, grounded\
          \ answer. \"资料未提及\" and similar placeholders are NOT\n    answers, so a\
          \ payload made only of them must fail.\n    \"\"\"\n    import json\n  \
          \  import re\n\n    # Phrases that mean \"the documents did not cover this\"\
          . Any field whose\n    # entire content is one of these is an empty field.\n\
          \    NO_INFO = (\n        \"资料未提及\",\n        \"未找到相关技术资料\",\n        \"\
          未找到相关资料\",\n        \"未找到相关文档\",\n        \"无相关信息\",\n        \"无相关资料\"\
          ,\n        \"无相关文档\",\n        \"无信息\",\n        \"暂无相关资料\",\n        \"\
          暂无相关信息\",\n        \"资料不足\",\n        \"没有相关资料\",\n        \"not mentioned\
          \ in the material\",\n        \"not mentioned in the provided\",\n     \
          \   \"no relevant technical document found\",\n        \"no relevant information\"\
          ,\n        \"no relevant documents\",\n        \"no information available\"\
          ,\n        \"information not available\",\n        \"not available in the\
          \ provided\",\n        \"not provided\",\n        \"no documents found\"\
          ,\n        \"unknown\",\n        \"n/a\",\n        \"none\",\n    )\n\n\
          \    # Words that name a concrete document artifact. Generic words like\
          \ \"文档\"\n    # are deliberately excluded: \"已参考相关文档\" names nothing real.\n\
          \    DOC_HINTS = (\n        \"manual\", \"sop\", \"fault\", \"parts\", \"\
          handbook\", \"datasheet\",\n        \"手册\", \"说明书\", \"规程\", \"案例\", \"\
          目录\", \"报告\", \"图纸\", \"图册\",\n    )\n    # A real document name ends in\
          \ a filename or an explicit version.\n    DOC_NAME_RE = re.compile(r\"\\\
          .(txt|pdf|md|docx?|xlsx?|csv)\\b|版本\\s*v?\\d|v\\d+\\.\\d+\", re.I)\n\n \
          \   def flat(value) -> str:\n        \"\"\"Collapse any field value to a\
          \ single lowercase string.\"\"\"\n        parts = []\n\n        def walk(item):\n\
          \            if item is None:\n                return\n            if isinstance(item,\
          \ str):\n                parts.append(item)\n            elif isinstance(item,\
          \ dict):\n                for key in (\"text\", \"content\", \"value\",\
          \ \"name\", \"title\", \"document_name\"):\n                    if key in\
          \ item:\n                        walk(item[key])\n                     \
          \   return\n                for sub in item.values():\n                \
          \    walk(sub)\n            elif isinstance(item, (list, tuple, set)):\n\
          \                for sub in item:\n                    walk(sub)\n     \
          \       else:\n                parts.append(str(item))\n\n        walk(value)\n\
          \        return \" \".join(parts).strip()\n\n    def normalise(text: str)\
          \ -> str:\n        return re.sub(r\"[\\s，,。.;；:：、\\-—*\\[\\]{}()（）\\u3000]+\"\
          , \"\", text).lower()\n\n    def is_placeholder(text: str, allow_tail: bool\
          \ = True) -> bool:\n        \"\"\"True when a field carries no information\
          \ at all.\n\n        A marker only counts when it IS the whole value (allowing\
          \ for\n        punctuation/parenthetical wrappers). A sentence that happens\
          \ to contain\n        a marker must not be thrown away.\n\n        `allow_tail=False`\
          \ is used for source_documents, which must be a list of\n        document\
          \ names: anything starting with a no-information marker is not a\n     \
          \   document name, however long the rest of the sentence is. That catches\
          \ a\n        refusal dressed up as a citation such as\n        `资料未提及“远程关机”功能说明，无法据此定位原因（manual-14.txt）`.\n\
          \        \"\"\"\n        stripped = text.strip()\n        if not stripped:\n\
          \            return True\n        if stripped in {\"无\", \"[]\", \"{}\"\
          , \"-\", \"null\", \"none\"}:\n            return True\n        body = normalise(stripped)\n\
          \        if not body:\n            return True\n        for phrase in NO_INFO:\n\
          \            norm = normalise(phrase)\n            if not norm:\n      \
          \          continue\n            if norm == body:\n                return\
          \ True\n            # marker plus only a short qualifier, e.g. 资料未提及（无相关资料）\n\
          \            idx = body.find(norm)\n            if idx == 0 and (not allow_tail\
          \ or len(body) - len(norm) <= 16):\n                return True\n      \
          \  return False\n\n    def as_items(value):\n        if value is None:\n\
          \            return []\n        if isinstance(value, (list, tuple, set)):\n\
          \            return list(value)\n        return [value]\n\n    if llm_output\
          \ is None:\n        return {\"valid\": \"false\", \"answer_md\": \"\", \"\
          error\": \"empty_output\"}\n    if isinstance(llm_output, str):\n      \
          \  if not llm_output.strip():\n            return {\"valid\": \"false\"\
          , \"answer_md\": \"\", \"error\": \"empty_output\"}\n\n    # --- parse -------------------------------------------------------------\n\
          \    if isinstance(llm_output, dict):\n        data = llm_output\n    elif\
          \ isinstance(llm_output, str):\n        text = llm_output.strip()\n    \
          \    data = None\n        try:\n            data = json.loads(text)\n  \
          \      except Exception:\n            # Models sometimes wrap JSON in ```json\
          \ fences or add prose.\n            fenced = re.search(r\"```(?:json)?\\\
          s*(.*?)```\", text, re.S)\n            candidates = [fenced.group(1)] if\
          \ fenced else []\n            brace = re.search(r\"\\{.*\\}\", text, re.S)\n\
          \            if brace:\n                candidates.append(brace.group(0))\n\
          \            for candidate in candidates:\n                try:\n      \
          \              data = json.loads(candidate.strip())\n                  \
          \  break\n                except Exception:\n                    continue\n\
          \            if data is None:\n                return {\"valid\": \"false\"\
          , \"answer_md\": \"\", \"error\": \"parse_failed\"}\n    else:\n       \
          \ return {\"valid\": \"false\", \"answer_md\": \"\", \"error\": \"not_an_object\"\
          }\n\n    if not isinstance(data, dict):\n        return {\"valid\": \"false\"\
          , \"answer_md\": \"\", \"error\": \"not_an_object\"}\n\n    # --- normalise\
          \ keys (accept a few benign aliases) ----------------------\n    aliases\
          \ = {\n        \"possible_causes\": (\"possible_causes\", \"causes\", \"\
